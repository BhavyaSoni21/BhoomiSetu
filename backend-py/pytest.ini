[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
# TEST-01: tests/legacy holds ad-hoc debug scripts (module-level DB queries,
# not pytest tests) that error at collection time and abort the whole run.
# Quarantined here so a bare `pytest` collects the real suite; run them by
# hand if ever needed.
addopts = --ignore=tests/legacy
norecursedirs = tests/legacy
