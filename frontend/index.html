<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b4332" />
    <meta name="description" content="BhoomiSetu - GIS-based Land Governance & Cadastral Intelligence Platform" />
    <title>BhoomiSetu - GIS Land Governance Platform</title>
    <style>
      html, body { margin: 0; background: #F7F6EE; }
      html.dark, html.dark body { background: #071A14; }
    </style>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('bhoomisetu_theme');
          const dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch {
          // Keep the light background if browser storage is unavailable.
        }
      })();
    </script>
    <!-- Outfit: Bauhaus display/body face (docs/design.md §3). Noto Sans stays
         loaded as its Devanagari fallback - Outfit has no Hindi glyphs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=optional" rel="stylesheet">
  </head>
  <body class="font-sans antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
