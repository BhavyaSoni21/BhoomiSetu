server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend-py service container on Docker network
    location /api/ {
        proxy_pass http://backend-py:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # react-router uses client-side routing - every path must fall back to
    # index.html, or refreshing on e.g. /parcels/:id 404s at the server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
