# Root cause of the "offline landing / could not save / login not retained on
# refresh" cluster: the Render free-tier backend sleeps after ~15 min idle and
# its first request then takes 30-60s to wake, which the client misreads as
# offline / failed / logged-out. Ping /health every 10 min so it never sleeps.
#
# Note: GitHub cron can lag several minutes under load and only runs while the
# repo is active. For a demo/production SLA, an external monitor (UptimeRobot /
# cron-job.org, 5-min interval) is more reliable - this is the zero-dependency
# in-repo option. Change HEALTH_URL if the Render host changes.
name: keep-backend-warm

on:
  schedule:
    # */5, not */10: GitHub cron routinely lags 5-15 min under load, and Render
    # sleeps at 15 min idle. A 10-min nominal interval that slips past 15 leaves
    # a sleep gap; 5 min gives margin. Still not a guarantee - see the note above
    # about an external monitor for a real SLA.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              https://bhoomisetu-ryh4.onrender.com/health) && [ "$code" = "200" ] && {
              echo "healthy (HTTP $code)"; exit 0; }
            echo "attempt $i: HTTP ${code:-timeout}, retrying in 15s"; sleep 15
          done
          echo "backend did not return 200 after 3 attempts"; exit 1
