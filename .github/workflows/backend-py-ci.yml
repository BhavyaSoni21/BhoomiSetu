name: backend-py CI

# PYTHON_MIGRATION_PLAN.md §5: the first CI in this repository. Runs
# backend-py's pytest suite against a real Postgres+PostGIS service
# container, not SQLite - PostGIS-specific behavior is exactly what a
# rewrite risks getting subtly wrong, so this is the whole reason a
# lighter SQLite-based check wouldn't do. Scoped to backend-py/ changes
# only; the original NestJS backend has no test suite of its own to run
# here.

on:
  pull_request:
    paths:
      - "backend-py/**"
      - "backend/test/live/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/backend-py-ci.yml"
  push:
    branches: [python-migration, main]
    paths:
      - "backend-py/**"
      - "backend/test/live/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - ".github/workflows/backend-py-ci.yml"

concurrency:
  group: backend-py-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhoomisetu_py
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # --network host below puts every docker run on the runner's own
      # network namespace, so the service container is reachable as
      # localhost, not by service name.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: bhoomisetu_py
      # A fixed, non-production placeholder - CI never runs with
      # ENVIRONMENT=production, so app/main.py's real-secret refusal check
      # never triggers on this value.
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      # Built once, reused for both the migration step and the test run -
      # same image backend-py's own Dockerfile produces for local dev, so
      # this exercises the exact GDAL/tesseract/cairo system dependencies
      # a real deployment would also need, not a lighter CI-only stand-in.
      - name: Build backend-py image
        run: docker build -t backend-py-ci ./backend-py

      - name: Run Alembic migrations
        run: |
          docker run --rm --network host \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_NAME -e JWT_SECRET \
            backend-py-ci alembic upgrade head

      - name: Run pytest suite
        run: |
          docker run --rm --network host \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_NAME -e JWT_SECRET \
            backend-py-ci pytest -q

  # PYTHON_MIGRATION_PLAN.md §4's second validation gate: the original,
  # unmodified Jest specs (backend/test/live/*.live-spec.ts) run their
  # supertest assertions against a *running* backend-py instance over real
  # HTTP, instead of either an in-process NestJS app or a mocked backend-py
  # - the only thing that actually proves backend-py's real request/response
  # behavior, not just what a pytest port of the same spec believes it does.
  # Independent of the `test` job above (no `needs:`) so both report as
  # separate, equally-required checks rather than one gating the other.
  live-e2e:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhoomisetu_py
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: bhoomisetu_py
      JWT_SECRET: ci-test-secret-not-for-production
      # A real full-suite run (test/live/live-client.ts's own docstring)
      # trips backend-py's real 20/min login limit even --runInBand,
      # purely from createLiveAuthenticatedUser's cumulative real
      # POST /login calls across ~20 spec files - not something a slower
      # CI runner makes any less true. Disabled here the same way a local
      # full run needs it disabled; app/rate_limit.py's own pytest-suite
      # auto-disable is unrelated and doesn't cover this real running
      # instance.
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend-py image
        run: docker build -t backend-py-ci ./backend-py

      - name: Run Alembic migrations
        run: |
          docker run --rm --network host \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_NAME -e JWT_SECRET \
            backend-py-ci alembic upgrade head

      # Detached, not --rm, so its logs are still readable from the
      # "Show backend-py logs on failure" step below if the Jest run fails.
      # Bind-mounts backend-py/ the same way docker-compose.yml does for
      # local dev (not baked into the image build) - a couple of live specs
      # (parcels, historical-imagery) write a document/image file on the
      # Jest side and store its container-side /app/... path in the DB for
      # backend-py to read back; without this mount that path only exists
      # on the runner, not inside the container, and those specs 404/500.
      # Confirmed this exact failure mode locally against a freshly-built,
      # non-bind-mounted image before adding the mount here.
      - name: Start backend-py
        run: |
          docker run -d --network host --name backend-py-live \
            -v "${{ github.workspace }}/backend-py:/app" \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_NAME -e JWT_SECRET -e RATE_LIMIT_ENABLED \
            backend-py-ci

      - name: Wait for backend-py to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "backend-py is up"
              exit 0
            fi
            sleep 1
          done
          echo "backend-py never became healthy" >&2
          docker logs backend-py-live
          exit 1

      - name: Install Jest dependencies
        working-directory: backend
        run: npm ci

      # live-client.ts's own defaults (localhost:5432/8000, postgres/postgres,
      # bhoomisetu_py) already match this job's services/env above, so no
      # BACKEND_PY_* overrides are needed here.
      - name: Run live-spec suite
        working-directory: backend
        run: npm run test:e2e-live

      - name: Show backend-py logs on failure
        if: failure()
        run: docker logs backend-py-live

      - name: Stop backend-py
        if: always()
        run: docker rm -f backend-py-live
