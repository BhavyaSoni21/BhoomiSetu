# Reflects the actual architecture (see docs/STANDARD_TECHNICAL_DOCUMENT.md
# §1.1): one NestJS backend process, not a mesh of per-department services.
# The previous version of this file sketched separate `land-records-api`,
# `registration-api`, `planning-api`, `tax-api`, `restriction-api`, and
# `ai-service` containers - none of that was ever real; every "department"
# is a module inside the single `backend` service below. That version also
# set the frontend's VITE_API_URL to the internal Docker hostname
# (`http://backend:3000`), which a browser on the host can never resolve -
# fixed here by pointing it at the port actually published to the host.

services:
  frontend:
    build:
      context: ./frontend
      args:
        # The browser (not the frontend container) calls this URL, so it
        # must be a host-reachable address - the port published below, not
        # the internal Docker service name.
        VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - USE_SQLITE=false
      - DB_HOST=postgis
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=bhoomisetu
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
    depends_on:
      - postgis

  # PostGIS Database - no `ports:` mapping on purpose: the backend reaches
  # it over the internal Docker network by service name (`postgis`), which
  # needs no published host port at all. Publishing 5432 would put a
  # database with the default postgres/postgres credentials directly on
  # the internet on any host with a public IP - only add a `ports:` mapping
  # back here temporarily if you need a local psql client to connect for
  # debugging, and remove it again afterward.
  postgis:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bhoomisetu
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data:
